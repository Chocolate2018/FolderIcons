name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: |
          if [ ! -d FolderIcon ]; then for f in ./*.tar.gz; do tar xzf "$f"; done; fi
      - name: Theos
        uses: Randomblock1/theos-action@v1
      - name: 编译
        run: cd FolderIcon && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: FolderIcon/packages/*.deb
